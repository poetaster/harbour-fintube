name: Github CI build

on:
  push:
    tags:
      - '1.*'
env:
  RELEASE: 5.0.0.43

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Prepare
      run: mkdir output

    - name: Build aarch64
      id: build_aarch64
      uses: coderus/github-sfos-build@sfos5
      with:
        release: ${{ env.RELEASE }}
        arch: aarch64

    # 32-bit ARM phones (armv7hl images). The engine picks the matching yt-dlp/ffmpeg builds at
    # runtime and switches off the PO-token provider there (no 32-bit Deno).
    - name: Build armv7hl
      id: build_armv7hl
      uses: coderus/github-sfos-build@sfos5
      with:
        release: ${{ env.RELEASE }}
        arch: armv7hl

    - name: Extract Version Name
      id: extract_name
      uses: actions/github-script@v4
      with:
        result-encoding: string
        script: |
          return context.payload.ref.replace(/refs\/tags\//, '');

    - name: Create a Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.extract_name.outputs.result }}
        draft: false
        prerelease: false
        body: This release was autogenerated.
        files: 'RPMS/*.rpm'
